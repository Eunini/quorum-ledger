name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Simulator (2000 seeds)
        run: cargo run --release -p sim -- --seeds 2000 --threads 2
      - name: Simulator detects an injected bug
        run: |
          # The run must FAIL: proves the checker is not vacuous.
          if cargo run --release -p sim -- --seeds 200 --threads 2 --inject-bug vote-ignores-log; then
            echo "injected bug was not detected"; exit 1
          fi

  java:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build server binary for the cluster integration test
        run: cargo build --release -p server
      - name: Maven verify (unit tests + 3-node cluster integration test)
        run: ./mvnw -B verify

  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Workspace permissions, sessions, and operation idempotency
        run: node --test ops/portfolio-demo/test-store.mjs
      - name: Application syntax
        run: |
          node --check ops/portfolio-demo/server.mjs
          node --check ops/portfolio-demo/applications.mjs
          node --check web/shared.js
          node --check web/app.js
